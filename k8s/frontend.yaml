---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app.kubernetes.io/name: ai-recognition-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-recognition
    app: ai-recognition-frontend
data:
  # Địa chỉ service Backend API trong cluster Kubernetes.
  # Mặc định kết nối tới Service "ai-recognition-api" cổng 8000 trong cùng namespace.
  # Nếu Backend nằm ở namespace khác, dùng FQDN dạng: http://ai-recognition-api.<namespace>.svc.cluster.local:8000
  API_UPSTREAM: "http://ai-recognition-api:8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-recognition-frontend
  labels:
    app.kubernetes.io/name: ai-recognition-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-recognition
    app: ai-recognition-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-recognition-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-recognition-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ai-recognition
        app: ai-recognition-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/01phamtien/ai-recognition-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: API_UPSTREAM
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: ai-recognition-frontend
  labels:
    app.kubernetes.io/name: ai-recognition-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-recognition
    app: ai-recognition-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-recognition-frontend
