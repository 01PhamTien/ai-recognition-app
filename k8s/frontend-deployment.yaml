apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-recognition-frontend
  labels:
    app.kubernetes.io/name: ai-recognition-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-recognition
    app: ai-recognition-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-recognition-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-recognition-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ai-recognition
        app: ai-recognition-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      # imagePullSecrets su dung khi package tren GHCR duoc dat che do Private (secret ghcr-pull co san tren staging)
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          # Su dung image da publish tren GHCR theo tag commit SHA 12 ky tu tu pipeline Jenkins
          image: ghcr.io/01phamtien/ai-recognition-frontend:72405d63cbfe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: API_UPSTREAM
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
